name: Backend CI/CD

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest pytest-django

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Tests with pytest
      run: |
        pytest

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Determine image tag
      id: image_tag
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "tag=latest" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
          echo "tag=staging" >> $GITHUB_OUTPUT
        fi

    - name: Build and push image
      run: |
        docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/ncct-backend:${{ steps.image_tag.outputs.tag }} .
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/ncct-backend:${{ steps.image_tag.outputs.tag }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    steps:
      - name: Deploy to Staging
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.STAGING_DO_HOST }}
          username: ${{ secrets.STAGING_DO_USER }}
          key: ${{ secrets.STAGING_DO_SSH_KEY }}
          script: |
            cd /srv/ncct-backend-staging
            docker-compose pull
            docker-compose up -d --remove-orphans

  deploy-production:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Deploy to Production
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.PRODUCTION_DO_HOST }}
          username: ${{ secrets.PRODUCTION_DO_USER }}
          key: ${{ secrets.PRODUCTION_DO_SSH_KEY }}
          script: |
            cd /srv/ncct-backend
            docker-compose pull
            docker-compose up -d --remove-orphans