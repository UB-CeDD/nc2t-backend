services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    networks:
      - ncct_network

  backend:
    build: .
    env_file:
      - .env
    command: bash -c "python manage.py migrate && python manage.py create_superuser && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - mailhog
    networks:
      - ncct_network

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${SUPERUSER_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${SUPERUSER_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - ncct_network

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - ncct_network

volumes:
  postgres_data:

networks:
  ncct_network:
    driver: bridge